name: Check that version is updated

on:
  pull_request:
    branches: [ master ]
    # Only changes to what ships in the package need a new version
    paths:
      - 'src/**'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  CheckVersion:
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Version check
        run: |
          if ! git diff origin/master HEAD -- pyproject.toml | grep -q '^+version'
          then
            echo "You should probably update version number"
            exit 1
          fi
