# Builds the package and uploads it to PyPI using trusted publishing, then tags the release.
# The PyPI trusted publisher is bound to this workflow file and the `pypi` environment.
# For more information see: https://docs.pypi.org/trusted-publishers/
name: Upload Python Package

on:
  workflow_dispatch

permissions:
  contents: write  # push the release tag
  id-token: write  # trusted publishing

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Build the package
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

      - name: Tag and push new version
        run: |
          version_name=$(grep -m 1 version pyproject.toml | grep -Eo '[0-9]{1,}.[0-9]{1,}.[0-9]{1,}')
          git config --global user.name "Tag Bot"
          git config --global user.email "hello@cradl.ai"
          git tag -a "$version_name" -m "Version $version_name"
          git push origin "$version_name"

