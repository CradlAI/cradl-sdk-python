# This workflows will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries
name: Upload Python Package

on:
  workflow_dispatch

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Build the package
        run: uv build

      - name: Publish to PyPI
        env:
          UV_PUBLISH_USERNAME: ${{ secrets.PIP_USERNAME }}
          UV_PUBLISH_PASSWORD: ${{ secrets.PIP_PASSWORD }}
        run: uv publish

      - name: Tag and push new version
        run: |
          version_name=$(grep -m 1 version pyproject.toml | grep -Eo '[0-9]{1,}.[0-9]{1,}.[0-9]{1,}')
          git config --global user.name "Tag Bot"
          git config --global user.email "hello@cradl.ai"
          git tag -a "$version_name" -m "Version $version_name"
          git push origin "$version_name"

