name: Run linter on PR

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  CheckLinting:
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint
        run: make lint

